[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hemibrain-connectomes-analysis"
version = "4.5.0"
description = "Hemibrain connectome analysis and visualization toolkit with reorganized modular structure"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Hemibrain Analysis Team"}
]
keywords = ["neuroscience", "connectomics", "visualization", "network-analysis", "neuprint", "drosophila"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependencies pinned to tested working versions from conda env 'drocat'
dependencies = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "polars==1.34.0",
    "scipy==1.13.1",
    "pyarrow==17.0.0",
    "plotly==6.4.0",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "opencv-python==4.10.0.84",
    "bokeh==3.6.0",
    "kaleido==0.2.1",
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
    "networkx==3.3",
    "openpyxl==3.1.5",
    "tqdm==4.66.5",
    "requests==2.32.3",
    "Jinja2==3.1.6",
    "pillow==11.0.0",
    "pydantic>=2.10,<3.0.0",
    "python-rapidjson>=1.20",
    "PyQt5==5.15.10",
    "neuprint-python==0.4.26",
    "navis==1.5.0",
    "flybrains>=0.6.3",
    "boto3>=1.26.0",
    "reportlab>=4.0.0",
    "python-pptx>=0.6.21",
    "pymupdf>=1.23.0",
    "img2pdf==0.5.1",
    # NOTE: neuronbridge-python may fail on Windows due to memray dependency.
    # See docs/INSTALLATION.md for Windows troubleshooting.
    "neuronbridge-python>=3.3.0",
    # CAVE API dependencies for FlyWire (FAFB) online data fetching
    "caveclient>=8.0.0",
    "cloud-volume>=12.0.0",
    "fast-simplification>=0.1.0",
    "trimesh>=4.0.0",
    "psutil>=5.9.0",
    "xlsxwriter>=3.1.0",
]

[project.optional-dependencies]
# Web UI for local execution
ui = [
    "nicegui>=3.0.0",
]

# Visualization sub-project (minimal dependencies for standalone vispath)
vispath = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "scipy==1.13.1",
    "plotly==6.4.0",
    "networkx==3.3",
    "openpyxl==3.1.5",
    "PyQt5==5.15.10",
]

dev = [
    "pytest==7.0.0",
    "pytest-cov==3.0.0",
    "jupyter==1.0.0",
    "ipykernel==6.0.0",
    "black==22.0.0",
    "flake8==4.0.0",
]

viz = [
    "k3d==2.17.0",
    "ipywidgets==8.1.5",
    "open3d==0.19.0",
]

gui = [
    "PyQt6==6.0.0",
    "wxPython==4.2.0",
]

all = [
    "hemibrain-connectomes-analysis[dev,viz,gui,ui]"
]

[project.scripts]
drocat-ui = "ui.app:main"

[project.urls]
Homepage = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis"
Repository = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis"
Documentation = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis/blob/main/README.md"

[tool.setuptools]
# Package discovery - src layout (v2.1.0 reorganization)
# Core modules are in src/: coana.py, statvis.py, vispath.py
# Executable scripts are in scripts/: FindPath.py, FindDirect.py, etc.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

# Note: Scripts are in scripts/ directory and use:
#   sys.path.insert(0, str(Path(__file__).parent.parent / 'src'))
# to import from src/ modules

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | cache
  | __pycache__
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    "scripts/*",
    "examples/*",
    "dev/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
