[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vispath"
version = "1.0.0"
description = "Visualization toolkit for neural pathways - standalone component from Hemibrain Connectomes Analysis"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Kun-Da Wu"}
]
keywords = ["neuroscience", "visualization", "pathways", "connectomics", "network-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy==1.26.4",
    "pandas==1.5.3",
    "scipy==1.13.1",
    "plotly==6.4.0",
    "polars==1.34.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
gui = [
    "PyQt5==5.15.10",
]

all = [
    "vispath[gui]"
]

[project.urls]
Homepage = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis"
Repository = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis"
Documentation = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis/blob/main/README.md"
"Parent Project" = "https://github.com/Swida-Alba/hemibrain-connectomes-analysis"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vispath_pkg*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.json"]
